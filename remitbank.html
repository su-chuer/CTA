<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>系統設定｜匯款帳戶設定</title>
<link rel="stylesheet" href="css/style.css?v=384">
<link rel="icon" href="images/logo.png" type="image/png">
<style>
/* === 匯款帳戶設定專屬微調（沿用全站設計系統色彩與圓角規範） === */
.bank-picker-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  min-width: 185px;
  width: 185px;
  max-width: 100%;
  transition: width 0.15s ease;
}
.bank-picker-wrap.full-width {
  width: 100%;
}
.bank-picker-wrap input {
  width: 100%;
  padding-right: 34px;
  cursor: pointer;
  background-color: #ffffff;
}
.bank-picker-clear {
  position: absolute;
  right: 32px;
  top: 50%;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  color: #6c7992;
  font-size: 17px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  padding: 0;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.bank-picker-clear:hover {
  background: #eef2f7;
  color: #14264b;
}
.bank-picker-search-btn {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 32px;
  border: none;
  background: transparent;
  color: #0869ed;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
  padding: 0;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.bank-picker-search-btn:hover {
  background: #eef5ff;
  color: #0657c7;
}
.bank-split-layout {
  display: grid;
  grid-template-columns: 1.42fr 1fr;
  gap: 22px;
  align-items: start;
}
.bank-split-layout.is-single-col {
  grid-template-columns: minmax(0, 1fr);
}
.bank-split-layout > * {
  min-width: 0;
}
#bank-account-table {
  min-width: 0;
  width: 100%;
}
#bank-account-table tbody tr {
  transition: background-color 0.15s;
}
#bank-account-table tbody tr.is-selected td {
  background: #dceeff;
  font-weight: 600;
}
.bank-status-cell {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 14px;
}
.bank-status-cell svg {
  width: 15px;
  height: 15px;
  flex: 0 0 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.bank-status-cell.is-active {
  color: #166534;
  background: #dcfce7;
}
.bank-status-cell.is-inactive {
  color: #475569;
  background: #f1f5f9;
}

/* 右側精簡卡片樣式 */
#bank-editor-box {
  padding: 16px 18px;
  gap: 12px;
}
.bank-editor-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid #e1e7f0;
}
.bank-editor-title {
  font-size: 16px;
  font-weight: 700;
  color: #14264b;
  display: flex;
  align-items: center;
  gap: 8px;
}
.bank-form-two-col {
  display: grid;
  grid-template-columns: 1fr 1.25fr;
  gap: 10px;
}
.bank-form-two-col > * {
  min-width: 0;
}
#bank-editor-box .claim-field {
  gap: 4px;
}
#bank-editor-box .claim-control {
  height: 38px;
  font-size: 14px;
}
.bank-status-inline-row {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 2px 0;
  min-height: 30px;
}
.bank-status-inline-row > label {
  font-size: 14px;
  font-weight: 600;
  color: #3d5176;
  margin: 0;
}
.bank-status-inline-row .choice {
  margin: 0;
  height: auto;
  gap: 16px;
}

/* 精簡分段切換器 + 膠囊標籤區塊（取代佔空間的子表格） */
.bank-assign-box {
  background: #ffffff;
  border: 1px solid #d9e3f1;
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bank-segmented-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: #eef3fa;
  border-radius: 6px;
  padding: 3px;
  gap: 4px;
}
.bank-sub-tab {
  appearance: none;
  background: transparent;
  border: 0;
  border-radius: 5px;
  padding: 6px 10px;
  font-size: 14px;
  font-weight: 600;
  color: #556477;
  cursor: pointer;
  transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
}
.bank-sub-tab:hover {
  color: #0869ed;
}
.bank-sub-tab.active {
  background: #ffffff;
  color: #0869ed;
  box-shadow: 0 1px 3px rgba(20, 38, 75, 0.12);
}
.bank-sub-panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bank-sub-panel.hidden {
  display: none !important;
}
.ldap-input-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.ldap-input-row .claim-control {
  flex: 1;
  height: 36px;
}
.btn-icon-square {
  width: 36px;
  height: 36px;
  padding: 0;
  flex: 0 0 36px;
  border-radius: 6px;
  font-size: 19px;
  font-weight: 700;
  line-height: 1;
}
.bank-chip-list {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  min-height: 34px;
  max-height: 92px;
  overflow-y: auto;
  padding: 6px 8px;
  background: #f8fafd;
  border: 1px dashed #d3dfef;
  border-radius: 6px;
}
.bank-chip-empty {
  font-size: 13px;
  color: #8492a6;
  width: 100%;
  text-align: center;
  padding: 2px 0;
}
.bank-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #e8f1ff;
  border: 1px solid #c3dafc;
  color: #14264b;
  font-size: 13px;
  font-weight: 600;
  padding: 3px 8px 3px 10px;
  border-radius: 999px;
  line-height: 1.3;
}
.bank-chip.team-chip {
  background: #eef6ff;
  border-color: #bfd8fb;
}
.bank-chip small {
  color: #5b6d8a;
  font-weight: 500;
  font-size: 12px;
}
.bank-chip-del {
  appearance: none;
  border: 0;
  background: transparent;
  color: #6b7c96;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
  padding: 0;
  cursor: pointer;
  transition: background-color 0.15s, color 0.15s;
}
.bank-chip-del:hover {
  background: #fee2e2;
  color: #dc2626;
}

.bank-editor-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 4px;
  padding-top: 12px;
  border-top: 1px solid #e1e7f0;
}
.claim-add-box.is-create-mode .bank-editor-actions {
  border-top-color: #bfdbfe;
}
.bank-editor-actions .btn {
  flex: 1;
  height: 40px;
  font-size: 15px;
  font-weight: 600;
}
.btn.btn-create-account {
  background: #0869ed;
  border-color: #0869ed;
  color: #ffffff;
  box-shadow: 0 2px 6px rgba(8, 105, 237, 0.24);
}
.btn.btn-create-account:hover:not(:disabled) {
  background: #0657c7;
  border-color: #0657c7;
  box-shadow: 0 3px 8px rgba(8, 105, 237, 0.32);
}
@keyframes editorBoxBluePulse {
  0% {
    border-color: #0869ed;
    box-shadow: 0 0 0 1.5px #60a5fa, 0 0 0 4px rgba(8, 105, 237, 0.22);
  }
  55% {
    border-color: #60a5fa;
    box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.35), 0 0 0 2px rgba(59, 130, 246, 0.12);
  }
  100% {
    border-color: #93c5fd;
    box-shadow: 0 2px 10px rgba(8, 105, 237, 0.08);
  }
}
.claim-add-box.blue-pulse {
  animation: editorBoxBluePulse 0.65s ease-out;
}
.claim-add-box.is-create-mode {
  background: #f0f7ff;
  border: 1.5px solid #93c5fd;
  box-shadow: 0 2px 10px rgba(8, 105, 237, 0.08);
}
.claim-add-box.is-create-mode .bank-editor-header {
  border-bottom-color: #bfdbfe;
}
.claim-add-box.is-create-mode .bank-editor-title {
  color: #0657c7;
}
.claim-add-box.is-create-mode .bank-assign-box {
  border-color: #bfdbfe;
}
.claim-add-box.is-create-mode .bank-segmented-tabs {
  background: #dbeafe;
}
.claim-add-box.is-create-mode .bank-sub-tab.active {
  color: #0869ed;
}
.btn.btn-heqi-outline {
  background: #eef5ff;
  border: 1.5px dashed #3b82f6;
  color: #0657c7;
}
.btn.btn-heqi-outline:hover:not(:disabled) {
  background: #dceeff;
  border-color: #0869ed;
  color: #05449e;
}
@media (max-width: 960px) {
  .bank-split-layout {
    grid-template-columns: minmax(0, 1fr);
  }
}
</style>
</head>
<body>

<main class="page">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
    <nav class="crumb" id="page-crumb" style="margin: 0;">
      <span class="home-icon">
        <svg class="ico" aria-hidden="true"><use href="#ico-banknote"></use></svg>
      </span>
      <span class="sep">│</span>
      <span>系統設定</span>
      <span class="sep">/</span>
      <strong id="crumb-current">匯款帳戶設定</strong>
    </nav>
    <div class="search-actions" style="margin-left: auto;">
      <button type="button" class="btn danger" id="btn-clear-all-sample">清空名單</button>
      <button type="button" class="btn primary" id="btn-view-sample">觀看範例</button>
    </div>
  </div>

  <!-- ==================== 頂部查詢條件 ==================== -->
  <section class="panel filters" aria-label="匯款銀行查詢條件">
    <div class="field">
      <label for="filter-bank-code">代碼 / 銀行名稱</label>
      <div class="bank-picker-wrap group-select-auto" id="filter-bank-picker-wrap">
        <input type="text" id="filter-bank-code" class="filter-input" readonly autocomplete="off" value="全部帳號" placeholder="全部帳號">
        <button type="button" class="bank-picker-search-btn" id="btn-open-filter-bank-modal" title="選擇銀行代碼" aria-label="選擇銀行代碼">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.2" y2="16.2"></line></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="filter-account-keyword">戶名 / 帳戶</label>
      <input type="text" id="filter-account-keyword" class="filter-input" style="width: 240px;" placeholder="請輸入戶名或帳戶">
    </div>

    <div class="search-actions" style="margin-left: 6px;">
      <button type="button" class="btn primary" id="btn-search"><svg class="ico" aria-hidden="true"><use href="#ico-search"></use></svg>查詢</button>
      <button type="button" class="btn" id="btn-reset"><svg class="ico" aria-hidden="true"><use href="#ico-eraser"></use></svg>清除</button>
    </div>
  </section>

  <!-- ==================== 下方雙欄作業區：左側帳戶列表 / 右側新增與修改表單 ==================== -->
  <section class="panel table-panel hidden" id="bank-result-panel" style="margin-top: 15px;" aria-label="匯款銀行維護作業">
    <div id="table-loading" class="block-loading hidden"><div class="spinner"></div></div>

    <div class="bank-split-layout" id="bank-split-layout">
      <!-- 左側：匯款銀行帳戶列表 -->
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; min-height: 36px;">
          <div style="font-size: 15px; color: #556477; font-weight: 600;">銀行帳戶：<span id="account-count-display" style="color: #14264b; font-weight: 700;">0</span> 筆<span style="margin-left: 10px; color: #166534;">（啟用：<span id="account-active-count-display" style="font-weight: 700;">0</span> 筆）</span></div>
          <button type="button" class="btn btn-create-account" id="btn-switch-create-top" style="height: 36px; padding: 0 14px; font-size: 14px; font-weight: 600;">+ 新增匯款帳戶</button>
        </div>

        <div class="table-scroll">
          <table class="detail-table" id="bank-account-table">
            <thead>
              <tr>
                <th class="center" style="width: 68px;">序號</th>
                <th>戶名</th>
                <th style="width: 104px;">銀行代碼</th>
                <th>帳戶</th>
                <th class="center" style="width: 104px;">狀態</th>
                <th class="center" style="width: 80px;">編輯</th>
              </tr>
            </thead>
            <tbody id="bank-account-tbody">
              <tr><td colspan="6" class="empty">請選擇條件搜尋</td></tr>
            </tbody>
          </table>
        </div>

        <!-- 分頁元件 -->
        <div class="pagination hidden" id="pagination">
          <select id="per-page-select" class="page-select" aria-label="每頁顯示筆數">
            <option value="10" selected>10 筆 / 頁</option>
            <option value="20">20 筆 / 頁</option>
            <option value="50">50 筆 / 頁</option>
            <option value="100">100 筆 / 頁</option>
          </select>
          <button type="button" class="page-btn disabled" id="page-prev" aria-label="上一頁"><svg class="ico ico-tiny" aria-hidden="true"><use href="#ico-chevron-left"></use></svg></button>
          <div id="page-numbers" style="display:flex; gap:6px; align-items:center;"></div>
          <button type="button" class="page-btn" id="page-next" aria-label="下一頁"><svg class="ico ico-tiny" aria-hidden="true"><use href="#ico-chevron-right"></use></svg></button>
          <span class="page-info">共 <span id="total-pages">1</span> 頁 / <span id="total-items">0</span> 筆</span>
        </div>
      </div>

      <!-- 右側：新增 / 修改匯款帳戶資料精簡表單卡片 -->
      <div class="claim-add-box is-create-mode" id="bank-editor-box" aria-label="匯款銀行編輯表單">
        <div class="bank-editor-header">
          <div class="bank-editor-title">
            <span id="editor-mode-title">新增匯款帳戶</span>
          </div>
          <span class="status-badge pending hidden" id="editor-mode-badge">編輯中</span>
        </div>

        <!-- 銀行代碼 * -->
        <div class="claim-field">
          <label for="form-bank-code">銀行代碼 <b>*</b></label>
          <div class="bank-picker-wrap full-width" id="form-bank-picker-wrap">
            <input type="text" id="form-bank-code" class="claim-control" readonly autocomplete="off" placeholder="請選擇">
            <button type="button" class="bank-picker-search-btn" id="btn-open-form-bank-modal" title="選擇銀行代碼" aria-label="選擇銀行代碼">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.2" y2="16.2"></line></svg>
            </button>
          </div>
        </div>

        <!-- 戶名 * 與 帳號 * 並排精簡呈現 -->
        <div class="bank-form-two-col">
          <div class="claim-field">
            <label for="form-account-name">戶名 <b>*</b></label>
            <input type="text" id="form-account-name" class="claim-control" placeholder="請輸入戶名">
          </div>

          <div class="claim-field">
            <label for="form-account-number">帳號 <b>*</b></label>
            <input type="text" id="form-account-number" class="claim-control" inputmode="numeric" placeholder="請輸入帳號">
          </div>
        </div>

        <!-- 人員 / 組隊 精簡膠囊標籤區塊 -->
        <div class="bank-assign-box">
          <div class="bank-segmented-tabs" role="tablist" aria-label="人員與組隊切換">
            <button type="button" class="bank-sub-tab active" id="subtab-staff" role="tab" aria-selected="true" data-subtab="staff">人員 (<span id="staff-tab-count">0</span>)</button>
            <button type="button" class="bank-sub-tab" id="subtab-team" role="tab" aria-selected="false" data-subtab="team">組隊 (<span id="team-tab-count">0</span>)</button>
          </div>

          <!-- 子頁籤一：人員（輸入 LDAP + 膠囊標籤） -->
          <div class="bank-sub-panel" id="subpanel-staff">
            <div class="ldap-input-row">
              <input type="text" id="form-ldap-input" class="claim-control" placeholder="請輸入 LDAP 帳號">
              <button type="button" class="btn primary btn-icon-square" id="btn-add-ldap" title="新增人員" aria-label="新增人員">+</button>
            </div>
            <div class="bank-chip-list" id="staff-list-tbody">
              <span class="bank-chip-empty">尚未新增人員</span>
            </div>
          </div>

          <!-- 子頁籤二：組隊（選擇和氣組隊按鈕 + 膠囊標籤） -->
          <div class="bank-sub-panel hidden" id="subpanel-team">
            <button type="button" class="btn btn-heqi-outline" id="btn-open-heqi-modal" style="width: 100%; height: 36px; font-size: 14px; font-weight: 600;">
              <svg class="ico" style="width: 16px; height: 16px;" aria-hidden="true"><use href="#ico-search"></use></svg>新增和氣組隊
            </button>
            <div class="bank-chip-list" id="team-list-tbody">
              <span class="bank-chip-empty">尚未新增和氣組隊</span>
            </div>
          </div>
        </div>

        <!-- 狀態（單行精簡列） -->
        <div class="bank-status-inline-row">
          <label>狀態</label>
          <div class="choice">
            <label><input type="radio" name="form-bank-status" value="啟用" checked>啟用</label>
            <label><input type="radio" name="form-bank-status" value="停用">停用</label>
          </div>
        </div>

        <!-- 底部操作按鈕：確認送出 / 儲存 / 刪除 / 離開 -->
        <div class="bank-editor-actions">
          <button type="button" class="btn primary" id="btn-save-bank">確認送出</button>
          <button type="button" class="btn btn-danger-solid hidden" id="btn-delete-bank">刪除</button>
          <button type="button" class="btn" id="btn-leave-bank">清除</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== 下方雙欄作業區：左側帳戶列表 / 右側新增與修改表單 ==================== -->
</main>
<!-- ==================== 彈窗零：請選擇銀行（小放大鏡 Popup） ==================== -->
<div class="overlay hidden" id="bank-select-modal" style="z-index: 1270;">
  <div class="modal" style="width: min(620px, 100%); display: flex; flex-direction: column; max-height: 88vh; padding: 0;">
    <div class="modal-head" style="padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e1e7f0; background: #fff;">
      <h2 style="margin: 0; font-size: 17px; color: #14264b;">請選擇銀行</h2>
      <button type="button" class="x" id="close-bank-modal" aria-label="關閉">&times;</button>
    </div>

    <div style="padding: 14px 24px; background: #f8fafc; border-bottom: 1px solid #e1e7f0;">
      <input type="text" id="bank-modal-filter" class="claim-control" autocomplete="off" placeholder="銀行代碼篩選（請輸入代碼或銀行名稱，例如：008、華南）">
    </div>

    <div class="modal-body" style="padding: 0; overflow-y: auto; flex: 1; background: #fff;">
      <div class="table-scroll" style="border: 0; border-radius: 0;">
        <table class="detail-table" style="min-width: 0; width: 100%;">
          <thead style="position: sticky; top: 0; z-index: 5;">
            <tr>
              <th style="width: 140px;">銀行代碼</th>
              <th>銀行名稱</th>
              <th class="center" style="width: 96px;">選擇</th>
            </tr>
          </thead>
          <tbody id="bank-modal-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="modal-foot" style="padding: 14px 24px; border-top: 1px solid #e1e7f0; background: #f8fafc; display: flex; justify-content: flex-end;">
      <button type="button" class="btn" id="btn-bank-modal-cancel">取消</button>
    </div>
  </div>
</div>

<!-- ==================== 彈窗一：請選擇和氣組隊 ==================== -->
<div class="overlay hidden" id="heqi-select-modal" style="z-index: 1280;">
  <div class="modal" style="width: min(620px, 100%); display: flex; flex-direction: column; max-height: 88vh; padding: 0;">
    <div class="modal-head" style="padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e1e7f0; background: #fff;">
      <h2 style="margin: 0; font-size: 17px; color: #14264b;">請選擇和氣組隊</h2>
      <button type="button" class="x" id="close-heqi-modal" aria-label="關閉">&times;</button>
    </div>

    <div style="padding: 14px 24px; background: #f8fafc; border-bottom: 1px solid #e1e7f0;">
      <input type="text" id="heqi-modal-filter" class="claim-control" autocomplete="off" placeholder="請輸入和氣代碼或和氣名稱篩選（例如：ETE04、永康）">
    </div>

    <div class="modal-body" style="padding: 0; overflow-y: auto; flex: 1; background: #fff;">
      <div class="table-scroll" style="border: 0; border-radius: 0;">
        <table class="detail-table" style="min-width: 0; width: 100%;">
          <thead style="position: sticky; top: 0; z-index: 5;">
            <tr>
              <th style="width: 140px;">和氣代碼</th>
              <th>和氣名稱</th>
              <th class="center" style="width: 96px;">選擇</th>
            </tr>
          </thead>
          <tbody id="heqi-modal-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="modal-foot" style="padding: 14px 24px; border-top: 1px solid #e1e7f0; background: #f8fafc; display: flex; justify-content: flex-end;">
      <button type="button" class="btn" id="btn-heqi-modal-cancel">取消</button>
    </div>
  </div>
</div>

<!-- 操作確認彈窗 -->
<div class="overlay hidden" id="confirm-modal" style="z-index: 1320;">
  <div class="modal dialog-modal">
    <div class="modal-head dialog-head">
      <h2 id="confirm-modal-title">操作確認</h2>
      <button type="button" class="x" id="close-confirm" aria-label="關閉">&times;</button>
    </div>
    <div class="modal-body dialog-body" id="confirm-modal-body"></div>
    <div class="modal-foot dialog-foot">
      <button type="button" class="btn primary" id="btn-confirm-ok">確定</button>
      <button type="button" class="btn" id="btn-confirm-cancel">取消</button>
    </div>
  </div>
</div>

<!-- 單一按鈕提示彈窗 -->
<div class="overlay hidden" id="alert-modal" style="z-index: 1360;">
  <div class="modal dialog-modal">
    <div class="modal-head dialog-head">
      <h2>提示訊息</h2>
      <button type="button" class="x" id="close-alert" aria-label="關閉">&times;</button>
    </div>
    <div class="modal-body dialog-body" id="alert-modal-body">欄位填寫不完整！</div>
    <div class="modal-foot dialog-foot">
      <button type="button" class="btn primary" id="btn-alert-ok">確定</button>
    </div>
  </div>
</div>

  <div class="modal" style="width: min(1040px, 100%); display: flex; flex-direction: column; max-height: 92vh; padding: 0;">

<script src="js/common.js?v=413"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const filterBankInput = document.getElementById('filter-bank-code');
  const filterKwInput = document.getElementById('filter-account-keyword');
  const resultPanel = document.getElementById('bank-result-panel');
  const btnSearch = document.getElementById('btn-search');
  const btnReset = document.getElementById('btn-reset');
  const bankModalTbody = document.getElementById('bank-modal-tbody');
  const bankModalFilter = document.getElementById('bank-modal-filter');
  const formBankInput = document.getElementById('form-bank-code');
  const openFilterBankBtn = document.getElementById('btn-open-filter-bank-modal');
  const openFormBankBtn = document.getElementById('btn-open-form-bank-modal');

  let activeBankPickerTarget = 'filter';
  if (filterBankInput) filterBankInput.addEventListener('click', () => { activeBankPickerTarget = 'filter'; }, true);
  if (openFilterBankBtn) openFilterBankBtn.addEventListener('click', () => { activeBankPickerTarget = 'filter'; }, true);
  if (formBankInput) formBankInput.addEventListener('click', () => { activeBankPickerTarget = 'form'; }, true);
  if (openFormBankBtn) openFormBankBtn.addEventListener('click', () => { activeBankPickerTarget = 'form'; }, true);

  // 當上方查詢欄開啟銀行選擇彈窗時，於最上方動態補入「全部帳號」選項，並依目前選取狀態顯示「已選擇」
  if (bankModalTbody) {
    let isInjectingAllRow = false;
    const injectAllAccountsOption = () => {
      if (isInjectingAllRow) return;
      const existingAllRow = bankModalTbody.querySelector('tr[data-all-accounts="1"]');
      if (activeBankPickerTarget !== 'filter') {
        if (existingAllRow) existingAllRow.remove();
        return;
      }
      if (existingAllRow) return;
      const kw = (bankModalFilter ? bankModalFilter.value : '').trim();
      if (kw && !'全部帳號'.includes(kw) && !'全部'.includes(kw)) return;
      isInjectingAllRow = true;
      try {
        const currentVal = (filterBankInput ? filterBankInput.value : '').trim();
        const isSelected = currentVal === '' || currentVal === '全部帳號';
        const tr = document.createElement('tr');
        tr.dataset.allAccounts = '1';
        if (isSelected) tr.classList.add('is-selected');
        tr.innerHTML = `
          <td><strong>全部</strong></td>
          <td>全部帳號</td>
          <td class="center">${
            isSelected
              ? '<button type="button" class="btn primary small" disabled>已選擇</button>'
              : '<button type="button" class="btn primary small">選擇</button>'
          }</td>
        `;
        const btn = tr.querySelector('button');
        if (!isSelected && btn) {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (filterBankInput) filterBankInput.value = '全部帳號';
            const modal = document.getElementById('bank-select-modal');
            if (modal) modal.classList.add('hidden');
          });
        }
        bankModalTbody.insertBefore(tr, bankModalTbody.firstChild);
      } finally {
        isInjectingAllRow = false;
      }
    };
    const obs = new MutationObserver(injectAllAccountsOption);
    obs.observe(bankModalTbody, { childList: true });
  }

  // 攔截「查詢」按鈕：若代碼/銀行名稱為「全部帳號」，暫轉為空值給 remitbank.js 查全部，再還原顯示「全部帳號」並展開下方列表
  if (btnSearch && filterBankInput) {
    btnSearch.addEventListener('click', () => {
      const wasAll = filterBankInput.value.trim() === '全部帳號';
      if (wasAll) filterBankInput.value = '';
      if (resultPanel) resultPanel.classList.remove('hidden');
      setTimeout(() => {
        if (wasAll && filterBankInput.value.trim() === '') {
          filterBankInput.value = '全部帳號';
        }
      }, 0);
    }, true);
  }

  if (filterKwInput && btnSearch) {
    filterKwInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        e.stopImmediatePropagation();
        btnSearch.click();
      }
    }, true);
  }

  // 攔截「清除」按鈕：重設回「全部帳號」並將下方結果區塊恢復空白（隱藏）
  if (btnReset && filterBankInput) {
    btnReset.addEventListener('click', () => {
      setTimeout(() => {
        filterBankInput.value = '全部帳號';
        if (filterKwInput) filterKwInput.value = '';
        if (resultPanel) resultPanel.classList.add('hidden');
      }, 0);
    }, true);
  }
});
</script>
<script src="js/remitbank.js?v=413"></script>

</body>
</html>
